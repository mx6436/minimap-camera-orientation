# 训练配置——所有键都有代码内默认值，此处明示当前基线；

# 输入表示：polar = 极坐标展开（当前基线）；ref = 观测与参考底图各自极坐标展开后按
# [obs.BGR, ref.BGR, ref.A] 7 通道并列拼接（需先 uv run prepare-data --mode ref）
input_mode = "ref"
# ref 训练可选：环内参考缺失（`ref.A<255`）占比**严格大于**该比例的训练样本在读取时排除
# （0~1；等于阈值保留）；缺省不写 = 不过滤。只影响训练集，val 不变；需 input_mode = "ref"
# max_ref_missing = 0.3

# 训练规模
batch_size = 32
epochs = 200
seed = 42

# 优化
lr = 1e-3
weight_decay = 1e-4
scheduler_patience = 8
early_stop_patience = 25

# 损失目标：360 bin 软标签的循环高斯 σ（度）
target_sigma = 3.0

# 困难样本权重：data/hard_raw/ 里的样本在训练损失里按该权重计（w = hard_weight，其余 1），
# 等价于把该样本复制成 N 份后在扩容集合上取普通均值；只进训练损失，val 与全部 val 指标无
# 权；data/hard_raw/ 为空时该值无效果
hard_weight = 5

# 运行时性能：bf16+compile 本机实测约 5x
precision = "bf16"  # conv 走 bf16，损失始终 fp32；无 avx512_bf16/amx 时不提速
compile = true      # 启动多花 ~2min 编译

# 数据增强
noise_augment = false
# 角向滚动：架构精确等变下的严格有效增广，同时平衡各 bin 的标注分布
roll_augment = true
