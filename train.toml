# 训练配置——所有键都有代码内默认值，此处明示当前基线；
# 注释掉的键同样有效，未知键会硬报错。

# 训练规模
batch_size = 32
epochs = 200
seed = 42

# 优化
lr = 1e-3
weight_decay = 1e-4
scheduler_patience = 8
early_stop_patience = 25

# 模型与损失
architecture = "cone"  # cone（默认）| angle_cnn（旧基线，供对照复现）
dropout = 0.0  # 仅 angle_cnn 使用
norm_lambda = 0.0  # 仅 angle_cnn 使用
head_grid = [2, 22]  # 仅 angle_cnn 使用
head_channels = 64  # 仅 angle_cnn 使用
radius_pool = "avg"  # 仅 angle_cnn 使用
norm = "group"  # 仅 angle_cnn 使用

# 数据增强（噪声增强固定开启，无开关）
rotation = true
