# 训练配置——所有键都有代码内默认值，此处明示当前基线；
# 注释掉的键同样有效，未知键会硬报错。

# 训练规模
batch_size = 32
epochs = 400
seed = 42

# 优化
lr = 1e-3
weight_decay = 1e-4
scheduler_patience = 20
early_stop_patience = 40

# 模型与损失
dropout = 0.0
norm_lambda = 0.0
head_grid = [2, 22]
head_channels = 64
radius_pool = "avg"
norm = "group"

# 数据增强（噪声增强固定开启，无开关）
rotation = true
