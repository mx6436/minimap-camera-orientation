# 训练配置——所有键都有代码内默认值，此处明示当前基线；

# 输入表示：polar = 极坐标展开（当前基线）；ref = 观测与参考底图各自极坐标展开后按
# [obs.BGR, ref.BGR, ref.A] 7 通道并列拼接（需先 uv run prepare_data.py --mode ref）
input_mode = "polar"
# ref 模式下 MapLocator 底图资产目录（本地 MaaEnd 工作副本，gitignored）；训练读离线
# 产物，此路径仅写入 record，与实机推理共用；需与 prepare_data.py --mode ref 一致
map_assets_root = "local/maplocator/resource/image/MapLocator"

# 训练规模
batch_size = 32
epochs = 200
seed = 42

# 优化
lr = 1e-3
weight_decay = 1e-4
scheduler_patience = 8
early_stop_patience = 25

# 损失目标：360 bin 软标签的循环高斯 σ（度）
target_sigma = 3.0

# 运行时性能：bf16+compile 本机实测约 5x
precision = "bf16"  # conv 走 bf16，损失始终 fp32；无 avx512_bf16/amx 时不提速
compile = true      # 启动多花 ~2min 编译

# 数据增强
noise_augment = false
# 角向滚动：架构精确等变下的严格有效增广，同时平衡各 bin 的标注分布
roll_augment = true
