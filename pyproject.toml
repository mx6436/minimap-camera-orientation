[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endfield-minimap"
version = "0.1.0"
description = "RGBA angle CNN predicting the Endfield camera angle from the world-anchored minimap"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5",
    "opencv-python>=5.0",
    "pillow>=12.3",
    "matplotlib>=3.11",
    "torch>=2.13",
    "MaaFw>=5.13.0b5",  # LinuxController + gamescope toolkit 需要 5.13.0b5+
]

[project.scripts]
train = "endfield.train.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["endfield"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # isort 导入排序
    "UP",  # pyupgrade
    "B",   # bugbear 常见错误
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
