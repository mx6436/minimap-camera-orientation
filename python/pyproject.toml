[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endfield-minimap"
version = "0.1.0"
description = "Angle CNN predicting the Endfield camera angle from the world-anchored minimap"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "opencv-python>=5.0",
    "matplotlib>=3.11",
    "torch>=2.13",
    "onnx>=1.18",
    "onnxruntime==1.19.2",  # 与 MaaEnd 运行时同版本（ORT 加载校验与实机口径一致）
    "onnxscript>=0.2",  # torch.onnx dynamo 导出器运行时依赖
]

[project.scripts]
train = "cli.train:main"
export-onnx = "cli.export_onnx:main"

[tool.hatch.build.targets.wheel]
packages = ["endfield", "cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # isort 导入排序
    "UP",  # pyupgrade
    "B",   # bugbear 常见错误
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
